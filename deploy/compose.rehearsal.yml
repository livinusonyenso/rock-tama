name: rocktama-d1

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    image: rocktama-d1-caddy:local
    ports: ['127.0.0.1:8443:443']
    networks:
      edge:
        ipv4_address: 172.29.44.2
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    build: ../backend
    image: ${D1_API_IMAGE:-rocktama-d1-api:local}
    environment:
      DATABASE_URL_FILE: /run/secrets/api_url
      AUTH_ORIGIN: https://api.rocktama.localhost:8443,https://shop.rocktama.localhost:8443
      TRUST_PROXY: 172.29.44.2,172.29.44.3
    secrets: [api_url]
    networks: [edge, data]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 12s
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: rocktama_d1
      POSTGRES_USER: rocktama_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    # Suppress statement text on SQL errors. Bootstrap ALTER ROLE statements contain credentials.
    command: [postgres, -c, log_min_error_statement=panic]
    secrets: [bootstrap_password]
    volumes: [pg_data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  db-bootstrap:
    build: ../backend/db
    image: rocktama-d1-bootstrap:local
    environment:
      PGHOST: db
      PGUSER: rocktama_bootstrap
      PGDATABASE: rocktama_d1
      PGPASSWORD_FILE: /run/secrets/bootstrap_password
      MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
      API_DB_PASSWORD_FILE: /run/secrets/api_password
    secrets: [bootstrap_password, migrator_password, api_password]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    tmpfs: [/var/lib/postgresql]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
    logging: *logging

  migrate:
    image: ${D1_API_IMAGE:-rocktama-d1-api:local}
    pull_policy: never
    command: [node, src/migrate.mjs]
    environment:
      DATABASE_URL_FILE: /run/secrets/migrator_url
    secrets: [migrator_url]
    networks: [data]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
    logging: *logging

  frontend:
    profiles: [frontend]
    build: ../frontend
    image: rocktama-d1-frontend:local
    environment:
      API_URL: http://api:4000
      AUTH_CLIENT_IP_SOURCE: x-forwarded-for
      DEPLOY_MODE: staging
      PAYSTACK_SECRET_KEY: ''
    networks:
      edge:
        ipv4_address: 172.29.44.3
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/account/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  backend-tests:
    profiles: [tests]
    build:
      context: ../backend
      target: tests
    image: rocktama-d1-tests:local
    command: [sh, -ec, 'npm test && node test/run-compose-integration.mjs']
    environment:
      API_DATABASE_URL_FILE: /run/secrets/api_url
      MIGRATOR_DATABASE_URL_FILE: /run/secrets/migrator_url
    secrets: [api_url, migrator_url]
    networks: [data]
    logging: *logging

networks:
  edge:
    ipam:
      # Fixed addresses (Caddy .2, Next.js .3, verifier probes .11/.12) stay below .128. Automatic addresses
      # (the API) come from the upper half, so no container can take Caddy's address first.
      config: [{subnet: 172.29.44.0/24, ip_range: 172.29.44.128/25}]
  data:
    internal: true

volumes:
  pg_data:
  caddy_data:
  caddy_config:

secrets:
  bootstrap_password:
    file: ../.d1/bootstrap-password
  migrator_password:
    file: ../.d1/migrator-password
  api_password:
    file: ../.d1/api-password
  migrator_url:
    file: ../.d1/migrator-url
  api_url:
    file: ../.d1/api-url
